name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        # Binary from GitHub Releases: avoids Docker Hub's anonymous pull rate limit.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/spot-cluster
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: 0.8.0
      # Gateway API CRD schemas (HTTPRoute, Gateway, ReferenceGrant) are not in the default catalog.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
      - name: Render and validate every kustomization
        run: |
          for dir in k8s/*/; do
            [ -f "${dir}kustomization.yaml" ] || continue
            echo "::group::${dir}"
            kubectl kustomize "$dir" \
              | ./kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
            echo "::endgroup::"
          done
      - name: No Services of type LoadBalancer
        run: |
          if grep -rnE 'type:\s*LoadBalancer' k8s/; then
            echo "::error::LoadBalancer Services cost ~\$10/month and bypass Cloudflare (see ADR-0002)"
            exit 1
          fi
      - name: No Ingress objects (routing is Gateway API only, ADR-0007)
        run: |
          if grep -rnE '^kind:\s*Ingress$' k8s/; then
            echo "::error::Add an HTTPRoute to k8s/gateway/routes.yaml instead"
            exit 1
          fi
