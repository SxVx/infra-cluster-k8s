name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        # Binary from GitHub Releases: avoids Docker Hub's anonymous pull rate limit.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/spot-cluster
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-filename-pattern 'values\.yaml$' k8s/
      - name: No Services of type LoadBalancer
        run: |
          if grep -rnE 'type:\s*LoadBalancer' k8s/; then
            echo "::error::LoadBalancer Services cost ~\$10/month and bypass Cloudflare (see ADR-0002)"
            exit 1
          fi
