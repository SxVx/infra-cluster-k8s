# CI identity for the app repo: may only update and watch the Deployment in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: personal-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: personal-web
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: personal-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: personal-web
---
# Long-lived token for the ServiceAccount (Kubernetes fills in the data; nothing secret here).
# Rotate: delete this Secret, re-apply, re-run scripts/ci-kubeconfig.sh.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: personal-web
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
